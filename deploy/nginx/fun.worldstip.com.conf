# ============================================================================
# fun.worldstip.com — 开放数据接口的跨域（CORS）配置
#
# 背景：fun 是纯静态站，.json / .md 的响应头只能由服务器下发。没有下面这段，
#       网页里的 fetch() 会被浏览器同源策略拦掉（服务端 / curl / Python 不受影响）。
#       已实测：线上当前 GET 不带 Access-Control-Allow-Origin，OPTIONS 返回 405。
#
# 用法（二选一）：
#   A. 只需补 CORS —— 把下面 loc 段合并进你现有的 server { } 里，然后
#        nginx -t && nginx -s reload
#   B. 新站点 —— 参考文末完整示例
#
# 验证（改完必须跑）：
#   curl -sS -D - -o /dev/null -H "Origin: https://example.com" \
#        https://fun.worldstip.com/api/index.json | grep -i access-control
#   期望看到：access-control-allow-origin: *
# ============================================================================

# ---------- A. 需要合并进现有 server 块的片段 ----------
location ~* \.(json|md)$ {
    add_header Access-Control-Allow-Origin      "*" always;
    add_header Access-Control-Allow-Methods     "GET, HEAD, OPTIONS" always;
    add_header Access-Control-Allow-Headers     "Range, If-None-Match, Content-Type" always;
    add_header Access-Control-Expose-Headers    "Content-Length, Content-Range, ETag" always;
    add_header Access-Control-Max-Age           86400 always;
    add_header Cache-Control                    "public, max-age=86400" always;
    add_header Vary                             "Accept-Encoding" always;

    # 预检请求：直接 204，不落盘、不进日志噪音
    if ($request_method = OPTIONS) { return 204; }
}


